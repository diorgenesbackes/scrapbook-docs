name: Verificar documentação
on:
  pull_request:
    branches: [dev, hlg, main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 2
          persist-credentials: false
      - run: git diff --check HEAD^1 HEAD
